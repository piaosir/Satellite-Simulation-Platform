<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卫星仿真平台</title>
    <!-- 主题预置：在 CSS/JS 加载前写好 data-theme，避免深色主题启动白闪（与 stores/theme.js 逻辑一致） -->
    <script>
      try {
        var m = localStorage.getItem('ui-theme')
        var sys = m !== 'dark' && m !== 'studio' && m !== 'light' && m !== 'studio-light'   // 没存过 / 跟随系统 / 认不出：出厂跟随系统
        var dark = m === 'dark' || m === 'studio' || (sys && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.skin = 'studio'   // 外观只剩专业浅色 / 专业深色，两档都带面板块结构
        if (dark) document.documentElement.style.background = '#111111'
      } catch (e) { /* ignore */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
